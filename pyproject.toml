[project]
name = "twentytwo-offerings"
version = "0.1.0"
description = ""
authors = [
  { name = "Massimiliano della Rovere", email = "massimiliano.dellarovere@dedalus.eu" },
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["rich (>=15.0.0,<16.0.0)"]

[tool.poetry]
packages = [{ include = "twentytwo_offerings", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = ["basedpyright (>=1.39.10,<2.0.0)", "flake8 (>=7.3.0,<8.0.0)"]

[tool.flake8]
max-line-length = 80
extend-ignore = ["E203"]

[tool.black]
line-length = 80
